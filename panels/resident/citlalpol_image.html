<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>citlalpol_image — Tezcatl</title>
<link rel="stylesheet" href="../../lib/core/fonts.css">
<style>
  /* Citlalpol drawn (lib/citlalpol/citlalpol-image-page.js): tezcatl's side (the satellite), Citlalpol (Venus,
     the morning star), the Internet (the Earth), and Zoozve -- Venus's quasi-satellite, retrograde on its loop -- for
     the local servers behind zoozve's gates (a `to`); each record of the skin's citlalpol_bus travels as a glyph.
     The pictures: assets/citlalpol/ (crux's, free to use). The sky (skyscape.webp, 3:1, its ends meeting) flows to the
     left without end: it is as high as the panel, so one turn is 300vh. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  html { background: #120a26; }
  body { background: url(../../assets/citlalpol/skyscape.webp) repeat-x 0 0 / auto 100%; animation: drift 180s linear infinite; }
  @keyframes drift { to { background-position: -300vh 0; } }
  body { display: flex; flex-direction: column; font: 11px/1.4 var(--tz-ui-font, monospace); color: #c9b8e8; }
  svg { flex: 1 1 auto; min-height: 0; width: 100%; display: block; }
  .route { fill: none; stroke: #d8cff0; stroke-width: 1.2; stroke-dasharray: 4 4; opacity: .8; }
  .ring text { fill: #e9e1ff; font: 9px var(--tz-ui-font, monospace); letter-spacing: .5px; opacity: .85; }
  .ring { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
  .ring.slow { animation-duration: 60s; }
  .ring.rev { animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg) } }
  /* Zoozve's loop: one path (defs) drawn faint, a glow of 6 in 100 running backwards along it (SMIL, the same clock
     as Zoozve's own motion, so the glow trails behind it) */
  .orbit { fill: none; stroke: #c9b8ff; stroke-opacity: .25; stroke-width: 1; }
  .glow { fill: none; stroke: #fff; stroke-width: 2; stroke-dasharray: 6 94; stroke-linecap: round; opacity: .8; }
  .packet { font-size: 18px; dominant-baseline: middle; text-anchor: middle; }
  .count { font-size: 10px; fill: #ffe08a; dominant-baseline: middle; text-anchor: middle; }
  .stop { font-size: 22px; fill: #ff6b6b; dominant-baseline: middle; text-anchor: middle; }
  #state { flex: 0 0 auto; padding: 2px 8px; color: #b3a6d9; background: rgba(5, 2, 15, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #state.none { color: #ff9a8a; }
  @media (prefers-reduced-motion: reduce) { .ring, body { animation: none; } }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid meet" aria-label="tezcatl, Citlalpol and the Internet">
  <defs>
    <path id="ring-sat"   d="M 42,2 a 30,30 0 1,1 0,60 a 30,30 0 1,1 0,-60" fill="none"/>
    <path id="ring-venus" d="M 95,145 a 40,40 0 1,1 0,80 a 40,40 0 1,1 0,-80" fill="none"/>
    <path id="ring-earth" d="M 348,95 a 40,40 0 1,1 0,80 a 40,40 0 1,1 0,-80" fill="none"/>
    <!-- an ellipse 120 x 60 whose top is at 60,0 (its centre 60,30): translated below to Venus's centre (95,185) -->
    <path id="zoozve-orbit" pathLength="100" d="M 60,0 a 60,30 0 1,0 0.01,0"/>
  </defs>
  <g id="zoozve-loop" transform="translate(35,155)">
    <use href="#zoozve-orbit" class="orbit"/>
    <use href="#zoozve-orbit" class="glow">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="12s" repeatCount="indefinite"/>
    </use>
  </g>
  <path id="leg-in"  class="route" d="M 48,62 C 40,105 95,120 95,152"/>
  <path id="leg-out" class="route" d="M 128,190 C 210,192 250,140 316,136"/>
  <image href="../../assets/citlalpol/communication_satellite_small.svg" x="17" y="9" width="50" height="46"/>
  <image href="../../assets/citlalpol/venus_small.svg" x="70" y="160" width="50" height="50"/>
  <image href="../../assets/citlalpol/earth_small.svg" x="323" y="110" width="50" height="50"/>
  <g transform="translate(35,155)">
    <image id="zoozve" href="../../assets/citlalpol/zoozve.svg" x="-9" y="-9" width="18" height="18">
      <animateMotion dur="12s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#zoozve-orbit"/></animateMotion>
    </image>
  </g>
  <g class="ring slow"><text><textPath href="#ring-sat" textLength="186">tezcatl · tezcatl · tezcatl ·</textPath></text></g>
  <g class="ring"><text><textPath href="#ring-venus" textLength="250">citlalpol · relay · citlalpol · relay ·</textPath></text></g>
  <g class="ring slow rev"><text><textPath href="#ring-earth" textLength="250">Internet · Internet · Internet ·</textPath></text></g>
  <g id="packets"></g>
</svg>
<div id="state"></div>
<script src="../../lib/core/config.js"></script>
<script src="../../lib/core/panel-bus.js"></script>
<script src="../../lib/core/panel-frame.js"></script>
<script src="../../lib/citlalpol/citlalpol-bus.js"></script>
<script src="../../lib/citlalpol/citlalpol-image.js"></script>
<script src="../../lib/citlalpol/citlalpol-image-page.js"></script>
</body>
</html>
