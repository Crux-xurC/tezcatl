<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>citlalpol_bus — Tezcatl</title>
<link rel="stylesheet" href="../../lib/core/fonts.css">
<style>
  /* Citlalpol's records for this skin's citlalpol_log and citlalpol_image (lib/citlalpol/citlalpol-bus-page.js).
     It shows only whether they flow. */
  :root { --cb-bg: #0a0710; --cb-fg: #c9b8e8; --cb-dim: #6a5c80; --cb-on: #ff9f1c; --cb-ok: #7fd17f; --cb-ng: #ff7a6b; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--cb-bg); color: var(--cb-fg);
               font: 12px/1.5 var(--tz-ui-font, monospace); }
  body { box-sizing: border-box; padding: 3px 8px; display: flex; gap: 1em; align-items: center; white-space: nowrap; }
  #name { color: var(--cb-on); }
  #citld.up { color: var(--cb-ok); }
  #citld.down { color: var(--cb-ng); }
  #flow { color: var(--cb-dim); }
  #flow.busy { color: var(--cb-on); }
  #last { color: var(--cb-dim); overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<span id="name">citlalpol</span>
<span id="citld">…</span>
<span id="flow"></span>
<span id="last"></span>
<script src="../../lib/core/config.js"></script>
<script src="../../lib/core/panel-bus.js"></script>
<script src="../../lib/core/panel-frame.js"></script>
<script src="../../lib/citlalpol/citlalpol-bus.js"></script>
<script src="../../lib/citlalpol/citlalpol-log.js"></script>
<script src="../../lib/citlalpol/citlalpol-bus-page.js"></script>
</body>
</html>
