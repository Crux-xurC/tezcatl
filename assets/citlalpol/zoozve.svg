<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Zoozve — stylized asteroid</title>
  <desc id="desc">A simplified, irregular grey rocky body with a softly faceted silhouette and stylized impact craters on a clean white background.</desc>
  <defs>
    <clipPath id="bodyClip">
      <path d="M320 62
        C367 57 407 72 447 94
        C493 119 527 153 548 196
        C571 241 579 283 568 327
        C559 370 534 412 501 448
        C467 486 422 517 377 539
        C337 559 291 567 250 555
        C205 542 164 522 128 491
        C91 459 65 420 53 375
        C40 330 44 282 57 237
        C70 191 93 150 128 118
        C163 86 207 69 252 64
        C278 61 299 64 320 62 Z"/>
    </clipPath>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d8d5"/>
      <stop offset=".48" stop-color="#a9aaa7"/>
      <stop offset="1" stop-color="#777b79"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f0f0ec" stop-opacity=".72"/>
      <stop offset="1" stop-color="#f0f0ec" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#555b5a" stop-opacity="0"/>
      <stop offset="1" stop-color="#454a49" stop-opacity=".58"/>
    </linearGradient>
  </defs>

  
  <path d="M320 62
    C367 57 407 72 447 94
    C493 119 527 153 548 196
    C571 241 579 283 568 327
    C559 370 534 412 501 448
    C467 486 422 517 377 539
    C337 559 291 567 250 555
    C205 542 164 522 128 491
    C91 459 65 420 53 375
    C40 330 44 282 57 237
    C70 191 93 150 128 118
    C163 86 207 69 252 64
    C278 61 299 64 320 62 Z"
    fill="url(#rock)" stroke="#666b69" stroke-width="5" stroke-linejoin="round"/>

  <g clip-path="url(#bodyClip)">
    <!-- broad, graphic light and shadow regions -->
    <path d="M28 190 C95 95 181 54 284 58 C213 91 166 124 130 174
      C91 228 76 290 86 348 C53 316 29 252 28 190Z"
      fill="#eeeeea" opacity=".58"/>
    <path d="M292 47 C414 54 533 124 578 236
      C540 204 493 184 444 181 C384 178 344 204 301 226
      C255 249 205 255 162 236 C217 226 245 194 266 153
      C282 122 288 83 292 47Z" fill="url(#light)"/>
    <path d="M574 282 C590 392 512 512 398 560
      C438 509 454 466 454 419 C454 359 421 318 393 284
      C455 317 513 321 574 282Z" fill="url(#shadow)"/>
    <path d="M60 390 C111 421 156 432 204 426
      C254 420 290 391 337 392 C389 393 421 433 455 463
      C401 452 370 465 337 491 C279 536 188 529 126 484
      C94 460 72 427 60 390Z" fill="#777c79" opacity=".22"/>

    <!-- stylized rocky bands -->
    <path d="M82 176 C121 142 148 146 178 157 C207 168 222 160 246 140
      C267 122 297 118 324 132 C284 137 273 163 246 180
      C211 202 179 195 150 184 C124 174 104 174 82 196Z"
