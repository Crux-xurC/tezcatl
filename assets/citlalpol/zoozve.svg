      <ellipse cx="161" cy="405" rx="20" ry="14" transform="rotate(8 161 405)"
        fill="none" stroke="#e8e9e4" stroke-width="3.5" opacity=".68"/>
    </g>

    <!-- smaller pits -->
    <g fill="#555c59" opacity=".32">
      <circle cx="122" cy="268" r="7"/><circle cx="145" cy="292" r="5"/>
      <circle cx="225" cy="115" r="6"/><circle cx="252" cy="206" r="5"/>
      <circle cx="316" cy="247" r="7"/><circle cx="394" cy="238" r="5"/>
      <circle cx="493" cy="270" r="8"/><circle cx="512" cy="389" r="6"/>
      <circle cx="388" cy="430" r="7"/><circle cx="324" cy="521" r="5"/>
      <circle cx="232" cy="485" r="7"/><circle cx="104" cy="355" r="6"/>
      <circle cx="466" cy="202" r="4"/><circle cx="207" cy="365" r="4"/>
    </g>
    <g fill="none" stroke="#eff0eb" stroke-width="3" opacity=".48">
