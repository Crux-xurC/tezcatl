    <!-- large shallow craters -->
    <g stroke-linejoin="round">
      <ellipse cx="194" cy="192" rx="42" ry="31" transform="rotate(-18 194 192)"
        fill="#777c79" opacity=".27" stroke="#666c69" stroke-width="5"/>
      <ellipse cx="188" cy="187" rx="36" ry="25" transform="rotate(-18 188 187)"
