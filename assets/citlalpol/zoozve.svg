      <ellipse cx="365" cy="168" rx="29" ry="23" transform="rotate(12 365 168)"
        fill="#626866" opacity=".24" stroke="#666c69" stroke-width="4"/>
      <ellipse cx="359" cy="163" rx="24" ry="18" transform="rotate(12 359 163)"
