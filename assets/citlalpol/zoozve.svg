    <g fill="#f1f1ed" opacity=".28">
      <path d="M126 127l25-13-8 24z"/><path d="M420 116l27 18-31-5z"/>
      <path d="M530 300l-13 24 3-31z"/><path d="M375 526l-24 13 8-22z"/>
      <path d="M91 438l23 15-27-2z"/><path d="M256 552l27-8-14 17z"/>
